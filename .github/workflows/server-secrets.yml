# Manual: give a server environment its Worker secrets without anyone seeing them
# (server/REFERENCE.md, "Secrets"). Was `server-session-key` (#285); generalised in #287.
#   SESSION_KEY  48 random bytes generated on the runner, piped into `wrangler secret put`.
#                Only set when missing, unless `rotate_session_key` is ticked (rotating signs
#                every player out).
#   APNs key     the repository secrets APNS_KEY_ID + APNS_PRIVATE_KEY (the .p8 file's text)
#                are copied into the Worker's secrets of the same names. Skipped with a notice
#                while either is missing. The team id is the wrangler var APNS_TEAM_ID.
# Uses the same CLOUDFLARE_API_TOKEN as deploys. Production needs a first deploy.
name: server-secrets

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Server environment
        type: choice
        options: [staging, production]
        default: staging
      rotate_session_key:
        description: Replace an existing SESSION_KEY (signs everyone out)
        type: boolean
        default: false

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"

defaults:
  run:
    working-directory: server

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_ENV: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Set SESSION_KEY if missing (or rotate)
        env:
          ROTATE: ${{ inputs.rotate_session_key }}
        run: |
          set -euo pipefail
          if npx wrangler secret list --env "$TARGET_ENV" | grep -q '"SESSION_KEY"'; then
            if [ "$ROTATE" != "true" ]; then
              echo "SESSION_KEY already set for $TARGET_ENV; nothing to do."
              exit 0
            fi
            echo "Rotating SESSION_KEY for $TARGET_ENV."
          fi
          openssl rand -base64 48 | tr -d '\n' | npx wrangler secret put SESSION_KEY --env "$TARGET_ENV"
          echo "SESSION_KEY set for $TARGET_ENV."
      - name: Copy the APNs key (APNS_KEY_ID, APNS_PRIVATE_KEY) if the repository has it
        env:
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${APNS_KEY_ID:-}" ] || [ -z "${APNS_PRIVATE_KEY:-}" ]; then
            echo "::notice title=APNs key skipped::Repository secrets APNS_KEY_ID / APNS_PRIVATE_KEY are not set; pushes stay off (server/REFERENCE.md, Push setup)."
            exit 0
          fi
          if ! printf '%s' "$APNS_PRIVATE_KEY" | grep -q -- '-----BEGIN PRIVATE KEY-----'; then
            echo "::error title=APNs key::APNS_PRIVATE_KEY is not a .p8 file (no BEGIN PRIVATE KEY line). Set it with: gh secret set APNS_PRIVATE_KEY < AuthKey_XXXX.p8"
            exit 1
          fi
          # One JSON object on stdin: both secrets in one Worker version; nothing on disk.
          node -e 'process.stdout.write(JSON.stringify({APNS_KEY_ID: process.env.APNS_KEY_ID.trim(), APNS_PRIVATE_KEY: process.env.APNS_PRIVATE_KEY}))' \
            | npx wrangler secret bulk --env "$TARGET_ENV"
          echo "APNs key set for $TARGET_ENV."
