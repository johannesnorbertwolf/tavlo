# One-off: give a server environment its SESSION_KEY (#285) without anyone seeing it.
# Generates 48 random bytes on the runner and pipes them straight into
# `wrangler secret put`. Only sets the key when it's missing, unless `rotate` is ticked
# (rotating signs every player out). Uses the same CLOUDFLARE_API_TOKEN as deploys.
name: server-session-key

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Server environment
        type: choice
        options: [staging, production]
        default: staging
      rotate:
        description: Replace an existing key (signs everyone out)
        type: boolean
        default: false

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"

defaults:
  run:
    working-directory: server

jobs:
  set-key:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Set SESSION_KEY if missing (or rotate)
        run: |
          set -euo pipefail
          if npx wrangler secret list --env "${{ inputs.environment }}" | grep -q '"SESSION_KEY"'; then
            if [ "${{ inputs.rotate }}" != "true" ]; then
              echo "SESSION_KEY already set for ${{ inputs.environment }}; nothing to do."
              exit 0
            fi
            echo "Rotating SESSION_KEY for ${{ inputs.environment }}."
          fi
          openssl rand -base64 48 | tr -d '\n' | npx wrangler secret put SESSION_KEY --env "${{ inputs.environment }}"
          echo "SESSION_KEY set for ${{ inputs.environment }}."
