name: TavliApp
options:
  bundleIdPrefix: com.plakoto
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.3"
  developmentLanguage: en
packages:
  TavliEngine:
    path: ../TavliEngine
targets:
  TavliApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    preBuildScripts:
      - name: Require Core ML model
        basedOnDependencyAnalysis: false
        script: |
          MODEL="$SRCROOT/TavliApp/Resources/PlakotoValue.mlpackage"
          if [ ! -f "$MODEL/Manifest.json" ]; then
            echo "error: PlakotoValue.mlpackage is missing — the app would silently fall back to random AI moves."
            echo "error: Generate it, then regenerate the project:"
            echo "error:   PYTHONPATH=. .venv/bin/python ios/scripts/convert_to_coreml.py && bash ios/TavliApp/setup.sh"
            exit 1
          fi
          # The other variants' models are optional (#143): without one the app
          # shows that variant as "AI not available yet" (two-player only).
          for NAME in PlakotoStandardValue FevgaValue PortesValue; do
            if [ ! -f "$SRCROOT/TavliApp/Resources/$NAME.mlpackage/Manifest.json" ]; then
              echo "warning: $NAME.mlpackage not bundled — that variant has no AI yet (drop it into TavliApp/Resources and re-run setup.sh)."
            fi
          done
    sources:
      - path: TavliApp
        excludes:
          - "**/*.md"
          - "**/*.entitlements"
    resources:
      - path: TavliApp/Resources
    dependencies:
      - package: TavliEngine
        product: TavliEngine
      - package: TavliEngine
        product: BoardGeometry
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.plakoto.TavliApp
        INFOPLIST_FILE: TavliApp/Info.plist
        # The App Store version, and the build number. `ios/scripts/release_archive.sh`
        # overrides the build number with the commit count on main (always increasing).
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "1"
        # Game Center capability (#134). Signing the entitlement needs a real
        # DEVELOPMENT_TEAM and the app registered in App Store Connect with Game
        # Center enabled; compile-only builds pass CODE_SIGNING_ALLOWED=NO.
        # Sign in with Apple (#285) is in the same entitlements file; automatic signing
        # adds the capability to the App ID.
        CODE_SIGN_ENTITLEMENTS: TavliApp/TavliApp.entitlements
        # Server v1 (#285, server/REFERENCE.md). Info.plist reads these: the deployed
        # Workers (subdomain `tavtav`, filled in with #287); a URL containing REPLACE would
        # count as "not configured" (the account screen says the server isn't available).
        # Debug builds talk to `wrangler dev` on this Mac (the simulator reaches localhost)
        # and can switch servers in the account screen's Developer card.
        TAVTAV_SERVER_URL_STAGING: "https://tavtav-server-staging.tavtav.workers.dev"
        TAVTAV_SERVER_URL_PRODUCTION: "https://tavtav-server.tavtav.workers.dev"
        TAVTAV_SERVER_URL: "$(TAVTAV_SERVER_URL_PRODUCTION)"
        # #287, in TavliApp.entitlements: push notifications (`aps-environment`: development
        # for Debug, production for Release = TestFlight / App Store) and the invite links'
        # universal-link host (Associated Domains, the server serves /.well-known/apple-app-
        # site-association for /join/*): staging for Debug, production for Release. Both need
        # the capabilities on the App ID (server/REFERENCE.md "Push + universal links setup").
        APS_ENVIRONMENT: production
        TAVTAV_APPLINKS_HOST: "tavtav-server.tavtav.workers.dev"
        # The iOS OAuth client id from Google Cloud (…apps.googleusercontent.com; public, not
        # a secret). Empty = "Sign in with Google isn't available" (#285).
        GOOGLE_IOS_CLIENT_ID: "937853478519-pifv3ciai2ecbo9m4r790ft07v482ag7.apps.googleusercontent.com"
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: ""
        LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          TAVTAV_SERVER_URL: "http://localhost:8787"
          APS_ENVIRONMENT: development
          TAVTAV_APPLINKS_HOST: "tavtav-server-staging.tavtav.workers.dev"
  TavliAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TavliAppUITests
    dependencies:
      - target: TavliApp
      - package: TavliEngine
        product: BoardGeometry
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: com.plakoto.TavliAppUITests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: ""
        TEST_TARGET_NAME: TavliApp
schemes:
  TavliApp:
    build:
      targets:
        TavliApp: all
        TavliAppUITests: [test]
    test:
      targets:
        - TavliAppUITests
