<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tavtav</title>
<meta name="description" content="Tavtav — Plakoto, Fevga and Portes for iPhone and iPad.">
<style>
  :root { --bg: #f6efe4; --card: #fffaf2; --ink: #2b1d12; --ink2: #6b5643; --accent: #c8862f; --edge: #e6d6bf; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14100c; --card: #1f1812; --ink: #f2e3c9; --ink2: #b9a488; --accent: #e09a45; --edge: #3a2d22; }
  }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 72px 16px; text-align: center; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 500; font-size: 3.2rem; margin: 0; }
  p { color: var(--ink2); }
  .links { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 28px; }
  .links a { color: var(--ink); text-decoration: none; padding: 8px 18px; border-radius: 999px;
             border: 1px solid var(--edge); background: var(--card); }
  .links a:hover { border-color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Tavtav</h1>
  <p>Plakoto, Fevga and Portes for iPhone and iPad — against the computer, a friend on the same device, or online.</p>
  <div class="links">
    <a href="privacy.html">Privacy Policy</a>
    <a href="https://github.com/johannesnorbertwolf/tavlo/issues">Support</a>
  </div>
</main>
</body>
</html>
